name: Native bridge
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install C++26 build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 libssl-dev
          python3 -m venv "$RUNNER_TEMP/cmake-tools"
          "$RUNNER_TEMP/cmake-tools/bin/pip" install --only-binary=:all: cmake==3.31.6
          echo "$RUNNER_TEMP/cmake-tools/bin" >> "$GITHUB_PATH"
      - name: Build and test on native ARM64
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --timeout 120
          build/symphony-mcp --version
      - uses: actions/upload-artifact@v4
        with:
          name: antigravity-ubuntu24.04-arm64
          path: build/symphony-mcp
          if-no-files-found: error
